<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Menu HUD Bleach</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                overflow: hidden;
                background: radial-gradient(ellipse at 50% 40%, #1b2440, #0b0f1a 75%);
                font-family: "Shippori Mincho B1", "Yu Mincho", serif;
                color: #efeae0;
            }

            .smoke {
                position: absolute;
                left: 0;
                bottom: 0;
                width: 360px;
                opacity: 0.25;
                pointer-events: none;
            }

            #open_menu {
                position: absolute;
                right: 32px;
                top: 32px;
                width: 180px;
                height: 64px;
                padding: 0;
                border: 16px solid transparent;
                border-image: url("../asset/cadre_petit.png") 40 fill / 16px stretch;
                background: transparent;
                color: #efeae0;
                font-family: inherit;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.15em;
                cursor: pointer;
            }
            #open_menu:hover { filter: brightness(1.2); }

            #menu {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 640px;
                height: 432px;
                transform: translate(-50%, -50%);
                box-sizing: border-box;
                border: 48px solid transparent;
                border-image: url("../asset/cadre_large.png") 48 fill / 48px stretch;
                display: none;
                flex-direction: column;
                align-items: center;
                padding: 0;
            }
            #menu.open { display: flex; }

            #menu .title {
                margin-top: 10px;
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 0.3em;
                color: #efeae0;
                text-shadow: 0 0 14px rgba(159, 183, 209, 0.7);
            }

            #menu .buttons {
                margin-top: 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
            }
            #menu.rolling .buttons { display: none; }

            #menu button.option {
                width: 300px;
                height: 48px;
                padding: 0;
                border: 12px solid transparent;
                border-image: url("../asset/cadre_petit.png") 40 fill / 12px stretch;
                background: transparent;
                color: #efeae0;
                font-family: inherit;
                font-size: 16px;
                cursor: pointer;
            }
            #menu button.option:hover { filter: brightness(1.25); }

            #close_menu {
                position: absolute;
                right: -32px;
                top: -38px;
                width: 56px;
                height: 56px;
                padding: 0;
                border: none;
                background: transparent;
                cursor: pointer;
            }

            /* ===== Reroll : roue de zanpakuto en 3D ===== */
            #roll {
                display: none;
                flex-direction: column;
                align-items: center;
                margin-top: 6px;
            }
            #menu.rolling #roll { display: flex; }

            .stage {
                position: relative;
                width: 420px;
                height: 250px;
                perspective: 1000px;
            }
            /* La roue est inclinée vers le haut pour donner de la profondeur */
            .wheel {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 0;
                height: 0;
                transform-style: preserve-3d;
                transform: rotateX(-14deg) rotateY(0deg);
                transition: transform 6.5s cubic-bezier(0.05, 0.75, 0.15, 1);
            }
            .card {
                position: absolute;
                width: 96px;
                height: 120px;
                left: -48px;
                top: -60px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                background: rgba(11, 15, 26, 0.85);
                border: 1px solid rgba(159, 183, 209, 0.55);
                box-shadow: inset 0 0 20px rgba(159, 183, 209, 0.25);
                backface-visibility: hidden;
            }
            .card .kanji {
                font-size: 48px;
                font-weight: 800;
                color: #efeae0;
                line-height: 1;
            }
            .card .label {
                font-size: 10px;
                letter-spacing: 0.1em;
                color: #9fb7d1;
            }
            .card.win {
                border-color: #efeae0;
                box-shadow: 0 0 34px rgba(239, 234, 224, 0.9), inset 0 0 26px rgba(159, 183, 209, 0.5);
            }

            /* Anneau de choc à l'arrêt */
            .ring {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 300px;
                height: 300px;
                margin: -150px 0 0 -150px;
                border-radius: 50%;
                border: 2px solid #efeae0;
                transform: scale(0.2);
                opacity: 0;
                pointer-events: none;
            }
            .ring.go { animation: shock 1s ease-out forwards; }
            @keyframes shock {
                0% { transform: scale(0.2); opacity: 0.9; }
                100% { transform: scale(1.4); opacity: 0; }
            }

            #roll_result {
                margin-top: 4px;
                min-height: 48px;
                font-size: 18px;
                text-align: center;
                color: #efeae0;
                opacity: 0;
                transition: opacity 0.5s ease;
            }
            #roll_result.show { opacity: 1; }
            #roll_result small {
                display: block;
                margin-top: 6px;
                font-size: 12px;
                color: #9fb7d1;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <img class="smoke" src="../asset/fumee.png" alt="">

        <button id="open_menu" type="button">MENU</button>

        <div id="menu" role="dialog" aria-labelledby="menu_title">
            <button id="close_menu" type="button" aria-label="Fermer"></button>
            <div class="title" id="menu_title">MENU</div>

            <div class="buttons">
                <button class="option" type="button">Inventaire</button>
                <button class="option" type="button">Missions</button>
                <button class="option" type="button">Division</button>
                <button class="option" type="button">Aide des commandes</button>
                <button class="option" id="reroll_btn" type="button">Reroll</button>
            </div>

            <div id="roll">
                <div class="stage">
                    <div class="wheel" id="wheel"></div>
                    <div class="ring" id="ring"></div>
                </div>
                <div id="roll_result">
                    <span id="roll_text"></span>
                    <small id="roll_back">Clique pour revenir</small>
                </div>
            </div>
        </div>

        <script>
            const menu = document.getElementById("menu");
            const wheel = document.getElementById("wheel");
            const ring = document.getElementById("ring");
            const result = document.getElementById("roll_result");
            const rollText = document.getElementById("roll_text");

            // Douze cartes disposées en cercle autour de l'axe vertical
            const cards = [
                ["霊", "REIATSU +10"], ["斬", "BANKAI"], ["炎", "GETSUGA"], ["氷", "HYORIN"],
                ["闇", "HUECO"], ["月", "TSUKUYOMI"], ["虚", "HOLLOW"], ["風", "SONIDO"],
                ["雷", "RAIKO"], ["血", "SANGRE"], ["刃", "ZANPAKUTO"], ["死", "SHINIGAMI"]
            ];
            const RADIUS = 210;
            const outcomes = cards.map(c => c[1] + " : nouvelle capacité débloquée");
            const elements = cards.map(function (c, i) {
                const card = document.createElement("div");
                card.className = "card";
                const step = 360 / cards.length;
                card.style.transform = "rotateY(" + (i * step) + "deg) translateZ(" + RADIUS + "px)";
                card.innerHTML = '<span class="kanji">' + c[0] + '</span><span class="label">' + c[1] + '</span>';
                wheel.appendChild(card);
                return card;
            });

            let angle = 0;
            let rolling = false;

            document.getElementById("open_menu").addEventListener("click", function () {
                menu.classList.add("open");
            });

            function closeMenu() {
                menu.classList.remove("open", "rolling");
                result.classList.remove("show");
                elements.forEach(e => e.classList.remove("win"));
            }
            document.getElementById("close_menu").addEventListener("click", closeMenu);
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closeMenu();
            });

            // Reroll : la roue tourne longtemps, en ralentissant, puis s'arrête sur une carte tirée au hasard
            document.getElementById("reroll_btn").addEventListener("click", function () {
                if (rolling) return;
                rolling = true;
                menu.classList.add("rolling");
                result.classList.remove("show");
                elements.forEach(e => e.classList.remove("win"));
                // Force le recalcul avant de tourner, sinon le navigateur saute la transition
                void wheel.offsetWidth;

                const target = Math.floor(Math.random() * cards.length);
                const step = 360 / cards.length;
                // Angle final qui met la carte choisie devant, précédé de 8 tours complets
                const mod = ((-target * step - angle) % 360 + 360) % 360;
                angle = angle + 2880 + mod;
                wheel.style.transform = "rotateX(-14deg) rotateY(" + angle + "deg)";

                setTimeout(function () {
                    elements[target].classList.add("win");
                    ring.classList.remove("go");
                    void ring.offsetWidth;
                    ring.classList.add("go");
                    rollText.textContent = outcomes[target];
                    result.classList.add("show");
                    rolling = false;
                }, 6600);
            });

            document.getElementById("roll_back").addEventListener("click", function () {
                if (rolling) return;
                menu.classList.remove("rolling");
                result.classList.remove("show");
            });
        </script>
    </body>
</html>
