<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Menu HUD Bleach</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                overflow: hidden;
                background: linear-gradient(180deg, #1b2440, #0b0f1a);
                font-family: "Shippori Mincho B1", "Yu Mincho", serif;
                color: #efeae0;
            }

            /* Fumée bleue en décor, en bas à gauche */
            .smoke {
                position: absolute;
                left: 0;
                bottom: 0;
                width: 420px;
                opacity: 0.5;
                pointer-events: none;
            }

            /* Éclair en décor, en haut à gauche */
            .lightning {
                position: absolute;
                left: 40px;
                top: 40px;
                width: 260px;
                opacity: 0.35;
                pointer-events: none;
            }

            /* Bouton qui ouvre le menu */
            #open_menu {
                position: absolute;
                right: 32px;
                top: 32px;
                width: 140px;
                height: 54px;
                border: none;
                background: url("../asset/cadre_petit.png") center / 100% 100% no-repeat;
                color: #efeae0;
                font-family: inherit;
                font-size: 16px;
                font-weight: 700;
                letter-spacing: 0.1em;
                cursor: pointer;
            }
            #open_menu:hover { filter: brightness(1.2); }

            /* Panneau du menu : cadre bleu étendu sur toute la zone */
            #menu {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 640px;
                height: 420px;
                transform: translate(-50%, -50%);
                background: url("../asset/cadre_large.png") center / 100% 100% no-repeat;
                display: none;
                flex-direction: column;
                align-items: center;
                padding: 0;
                box-sizing: border-box;
            }
            #menu.open { display: flex; }

            /* Bandeau de titre, au-dessus de la zone des boutons */
            #menu .title {
                margin-top: 70px;
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 0.2em;
                text-shadow: 0 0 12px rgba(159, 183, 209, 0.6);
            }

            #menu .buttons {
                margin-top: 26px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                align-items: center;
            }

            #menu button.option {
                width: 280px;
                height: 52px;
                border: none;
                background: url("../asset/cadre_petit.png") center / 100% 100% no-repeat;
                color: #efeae0;
                font-family: inherit;
                font-size: 16px;
                cursor: pointer;
            }
            #menu button.option:hover { filter: brightness(1.25); }

            /* Bouton fermer, en haut à droite du panneau */
            #close_menu {
                position: absolute;
                right: 26px;
                top: 26px;
                width: 32px;
                height: 32px;
                border: none;
                background: transparent;
                color: #efeae0;
                font-size: 22px;
                cursor: pointer;
            }

            /* Titre de section, décor en haut du panneau */
            .decor_top {
                position: absolute;
                left: 50%;
                top: 10px;
                width: 320px;
                transform: translateX(-50%);
                opacity: 0.8;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <img class="smoke" src="../asset/fumee.png" alt="">
        <img class="lightning" src="../asset/eclair.png" alt="">

        <button id="open_menu" type="button">MENU</button>

        <div id="menu">
            <img class="decor_top" src="../asset/cadre_titre.png" alt="">
            <button id="close_menu" type="button" aria-label="Fermer">×</button>
            <div class="title">MENU</div>
            <div class="buttons">
                <button class="option" type="button">Inventaire</button>
                <button class="option" type="button">Missions</button>
                <button class="option" type="button">Division</button>
                <button class="option" type="button">Aide des commandes</button>
            </div>
        </div>

        <script>
            // Ouvre et ferme le panneau du menu
            const menu = document.getElementById("menu");
            document.getElementById("open_menu").addEventListener("click", function () {
                menu.classList.add("open");
            });
            document.getElementById("close_menu").addEventListener("click", function () {
                menu.classList.remove("open");
            });
        </script>
    </body>
</html>
