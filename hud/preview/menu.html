<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Menu HUD Bleach</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                overflow: hidden;
                background: radial-gradient(ellipse at 50% 40%, #1b2440, #0b0f1a 75%);
                font-family: "Shippori Mincho B1", "Yu Mincho", serif;
                color: #efeae0;
            }

            /* Fumée discrète en bas à gauche */
            .smoke {
                position: absolute;
                left: 0;
                bottom: 0;
                width: 360px;
                opacity: 0.25;
                pointer-events: none;
            }

            /* Bouton d'ouverture : cadre petit, coins conservés */
            #open_menu {
                position: absolute;
                right: 32px;
                top: 32px;
                width: 150px;
                height: 52px;
                padding: 0;
                border: 20px solid transparent;
                border-image: url("../asset/cadre_petit.png") 40 fill / 20px stretch;
                background: transparent;
                color: #efeae0;
                font-family: inherit;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.15em;
                cursor: pointer;
            }
            #open_menu:hover { filter: brightness(1.2); }

            /* Panneau : cadre large, coins conservés (border-image avec tranches de 60 px) */
            #menu {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 640px;
                height: 440px;
                transform: translate(-50%, -50%);
                box-sizing: border-box;
                border: 60px solid transparent;
                border-image: url("../asset/cadre_large.png") 60 fill / 60px stretch;
                display: none;
                flex-direction: column;
                align-items: center;
                padding: 0;
            }
            #menu.open { display: flex; }

            /* Titre : texte simple, sans bloc de fond */
            #menu .title {
                margin-top: 10px;
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 0.3em;
                color: #efeae0;
                text-shadow: 0 0 14px rgba(159, 183, 209, 0.7);
            }

            #menu .buttons {
                margin-top: 26px;
                display: flex;
                flex-direction: column;
                gap: 14px;
                align-items: center;
            }

            /* Boutons : cadre petit, coins conservés */
            #menu button.option {
                width: 280px;
                height: 52px;
                padding: 0;
                border: 16px solid transparent;
                border-image: url("../asset/cadre_petit.png") 40 fill / 16px stretch;
                background: transparent;
                color: #efeae0;
                font-family: inherit;
                font-size: 16px;
                cursor: pointer;
            }
            #menu button.option:hover { filter: brightness(1.25); }

            /* Fermeture : zone transparente posée sur la croix du cadre */
            /* Position calculée depuis l'intérieur du panneau : la bordure de 60 px est soustraite */
            #close_menu {
                position: absolute;
                right: -44px;
                top: -50px;
                width: 56px;
                height: 56px;
                padding: 0;
                border: none;
                background: transparent;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <img class="smoke" src="../asset/fumee.png" alt="">

        <button id="open_menu" type="button">MENU</button>

        <div id="menu" role="dialog" aria-labelledby="menu_title">
            <button id="close_menu" type="button" aria-label="Fermer"></button>
            <div class="title" id="menu_title">MENU</div>
            <div class="buttons">
                <button class="option" type="button">Inventaire</button>
                <button class="option" type="button">Missions</button>
                <button class="option" type="button">Division</button>
                <button class="option" type="button">Aide des commandes</button>
            </div>
        </div>

        <script>
            // Ouvre et ferme le panneau du menu
            const menu = document.getElementById("menu");
            document.getElementById("open_menu").addEventListener("click", function () {
                menu.classList.add("open");
            });
            // Fermer : la croix du cadre, le bouton « Fermer » et la touche Échap
            function closeMenu() {
                menu.classList.remove("open");
            }
            document.getElementById("close_menu").addEventListener("click", closeMenu);
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closeMenu();
            });
        </script>
    </body>
</html>
