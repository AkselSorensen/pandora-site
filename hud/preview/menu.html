<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <title>Menu HUD Bleach</title>
        <style>
            body {
                margin: 0;
                height: 100vh;
                overflow: hidden;
                background: radial-gradient(ellipse at 50% 40%, #1b2440, #0b0f1a 75%);
                font-family: "Shippori Mincho B1", "Yu Mincho", serif;
                color: #efeae0;
            }

            /* Fumée discrète en bas à gauche */
            .smoke {
                position: absolute;
                left: 0;
                bottom: 0;
                width: 360px;
                opacity: 0.25;
                pointer-events: none;
            }

            /* Bouton d'ouverture */
            #open_menu {
                position: absolute;
                right: 32px;
                top: 32px;
                width: 150px;
                height: 52px;
                padding: 0;
                border: 20px solid transparent;
                border-image: url("../asset/cadre_petit.png") 40 fill / 20px stretch;
                background: transparent;
                color: #efeae0;
                font-family: inherit;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.15em;
                cursor: pointer;
            }
            #open_menu:hover { filter: brightness(1.2); }

            /* Panneau : cadre large, coins conservés */
            #menu {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 640px;
                height: 520px;
                transform: translate(-50%, -50%);
                box-sizing: border-box;
                border: 60px solid transparent;
                border-image: url("../asset/cadre_large.png") 60 fill / 60px stretch;
                display: none;
                flex-direction: column;
                align-items: center;
                padding: 0;
            }
            #menu.open { display: flex; }

            #menu .title {
                margin-top: 10px;
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 0.3em;
                color: #efeae0;
                text-shadow: 0 0 14px rgba(159, 183, 209, 0.7);
            }

            #menu .buttons {
                margin-top: 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                align-items: center;
            }
            #menu.rolling .buttons { display: none; }

            /* Boutons : cadre petit, coins conservés */
            #menu button.option {
                width: 280px;
                height: 44px;
                padding: 0;
                border: 16px solid transparent;
                border-image: url("../asset/cadre_petit.png") 40 fill / 16px stretch;
                background: transparent;
                color: #efeae0;
                font-family: inherit;
                font-size: 16px;
                cursor: pointer;
            }
            #menu button.option:hover { filter: brightness(1.25); }

            /* Fermeture : zone posée sur la croix du cadre */
            #close_menu {
                position: absolute;
                right: -44px;
                top: -50px;
                width: 56px;
                height: 56px;
                padding: 0;
                border: none;
                background: transparent;
                cursor: pointer;
            }

            /* ===== Reroll : prisme 3D ===== */
            #roll {
                display: none;
                flex-direction: column;
                align-items: center;
                margin-top: 18px;
            }
            #menu.rolling #roll { display: flex; }

            .stage {
                position: relative;
                width: 320px;
                height: 230px;
                perspective: 900px;
            }
            .prism {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 140px;
                height: 150px;
                margin: -75px 0 0 -70px;
                transform-style: preserve-3d;
                transform: rotateY(0deg);
                transition: transform 2.6s cubic-bezier(0.12, 0.8, 0.2, 1);
            }
            .face {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 6px;
                background: rgba(11, 15, 26, 0.8);
                border: 1px solid rgba(159, 183, 209, 0.55);
                box-shadow: inset 0 0 22px rgba(159, 183, 209, 0.25);
                backface-visibility: hidden;
            }
            .face .kanji {
                font-size: 60px;
                font-weight: 800;
                color: #efeae0;
                line-height: 1;
            }
            .face .label {
                font-size: 12px;
                letter-spacing: 0.12em;
                color: #9fb7d1;
            }
            .face.win {
                border-color: #efeae0;
                box-shadow: 0 0 30px rgba(239, 234, 224, 0.8), inset 0 0 26px rgba(159, 183, 209, 0.5);
            }

            /* Anneau de choc à l'arrêt */
            .ring {
                position: absolute;
                left: 50%;
                top: 50%;
                width: 260px;
                height: 260px;
                margin: -130px 0 0 -130px;
                border-radius: 50%;
                border: 2px solid #efeae0;
                transform: scale(0.2);
                opacity: 0;
                pointer-events: none;
            }
            .ring.go { animation: shock 0.9s ease-out forwards; }
            @keyframes shock {
                0% { transform: scale(0.2); opacity: 0.9; }
                100% { transform: scale(1.4); opacity: 0; }
            }

            #roll_result {
                margin-top: 6px;
                min-height: 48px;
                font-size: 18px;
                text-align: center;
                color: #efeae0;
                opacity: 0;
                transition: opacity 0.5s ease;
            }
            #roll_result.show { opacity: 1; }
            #roll_result small {
                display: block;
                margin-top: 6px;
                font-size: 12px;
                color: #9fb7d1;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <img class="smoke" src="../asset/fumee.png" alt="">

        <button id="open_menu" type="button">MENU</button>

        <div id="menu" role="dialog" aria-labelledby="menu_title">
            <button id="close_menu" type="button" aria-label="Fermer"></button>
            <div class="title" id="menu_title">MENU</div>

            <div class="buttons">
                <button class="option" type="button">Inventaire</button>
                <button class="option" type="button">Missions</button>
                <button class="option" type="button">Division</button>
                <button class="option" type="button">Aide des commandes</button>
                <button class="option" id="reroll_btn" type="button">Reroll</button>
            </div>

            <div id="roll">
                <div class="stage">
                    <div class="prism" id="prism">
                        <div class="face" style="transform: rotateY(0deg) translateZ(121px)"><span class="kanji">霊</span><span class="label">REIATSU +10</span></div>
                        <div class="face" style="transform: rotateY(60deg) translateZ(121px)"><span class="kanji">斬</span><span class="label">BANKAI</span></div>
                        <div class="face" style="transform: rotateY(120deg) translateZ(121px)"><span class="kanji">炎</span><span class="label">GETSUGA</span></div>
                        <div class="face" style="transform: rotateY(180deg) translateZ(121px)"><span class="kanji">氷</span><span class="label">HYORIN</span></div>
                        <div class="face" style="transform: rotateY(240deg) translateZ(121px)"><span class="kanji">闇</span><span class="label">HUECO</span></div>
                        <div class="face" style="transform: rotateY(300deg) translateZ(121px)"><span class="kanji">月</span><span class="label">TSUKUYOMI</span></div>
                    </div>
                    <div class="ring" id="ring"></div>
                </div>
                <div id="roll_result">
                    <span id="roll_text"></span>
                    <small id="roll_back">Clique pour revenir</small>
                </div>
            </div>
        </div>

        <script>
            const menu = document.getElementById("menu");
            const prism = document.getElementById("prism");
            const ring = document.getElementById("ring");
            const result = document.getElementById("roll_result");
            const rollText = document.getElementById("roll_text");
            const faces = prism.querySelectorAll(".face");
            const outcomes = ["Reiatsu +10 pendant 5 min", "Bankai débloqué", "Getsuga Tenshō", "Hyōrinmaru", "Hueco Mundo : vision", "Tsukuyomi : illusion"];
            let angle = 0;
            let rolling = false;

            document.getElementById("open_menu").addEventListener("click", function () {
                menu.classList.add("open");
            });

            // Fermer : la croix du cadre et la touche Échap
            function closeMenu() {
                menu.classList.remove("open", "rolling");
                result.classList.remove("show");
                faces.forEach(f => f.classList.remove("win"));
            }
            document.getElementById("close_menu").addEventListener("click", closeMenu);
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") closeMenu();
            });

            // Reroll : le prisme tourne plusieurs tours puis s'arrête sur une face tirée au hasard
            document.getElementById("reroll_btn").addEventListener("click", function () {
                if (rolling) return;
                rolling = true;
                menu.classList.add("rolling");
                result.classList.remove("show");
                faces.forEach(f => f.classList.remove("win"));

                const target = Math.floor(Math.random() * 6);
                // Angle final qui met la face choisie devant : on ajoute 5 tours complets
                const mod = ((-target * 60 - angle) % 360 + 360) % 360;
                angle = angle + 1800 + mod;
                prism.style.transform = "rotateY(" + angle + "deg)";

                setTimeout(function () {
                    faces[target].classList.add("win");
                    ring.classList.remove("go");
                    void ring.offsetWidth; // relance l'animation
                    ring.classList.add("go");
                    rollText.textContent = outcomes[target];
                    result.classList.add("show");
                    rolling = false;
                }, 2700);
            });

            // Retour aux boutons après un reroll
            document.getElementById("roll_back").addEventListener("click", function () {
                if (rolling) return;
                menu.classList.remove("rolling");
                result.classList.remove("show");
            });
        </script>
    </body>
</html>
