<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="style.css">
        <script src="index.js"></script>
    </head>
    <body>
        <!-- Bandeau de mission : haut centre, sous la boussole -->
        <div id="mission">
            <div class="mission_title" id="mission_title">Aucune mission</div>
            <div class="mission_bar"><div id="mission_fill"></div></div>
        </div>

        <!-- Carte du joueur : haut gauche -->
        <div id="player_card">
            <div class="division" id="player_division">DIVISION —</div>
            <div class="name" id="player_name">Shinigami</div>
        </div>

        <!-- Boussole : haut centre -->
        <div id="compass">
            <div class="strip"><span id="compass_strip">N · · E · · S · · O · · N</span></div>
            <div class="marker"></div>
        </div>

        <!-- Fil d'événements : haut droite -->
        <div id="feed"></div>

        <!-- Invite d'action : sous le réticule -->
        <div id="prompt" class="hidden">
            <span class="key" id="prompt_key">E</span>
            <span id="prompt_text">Ramasser</span>
        </div>

        <!-- Réticule : centre -->
        <div id="crosshair"><span></span><span></span><span></span><span></span></div>

        <!-- Chat : bas gauche, au-dessus de la vie -->
        <div id="chat">
            <div id="chat_log"></div>
        </div>

        <!-- Reiatsu (vie) : bas gauche -->
        <div id="health_container">
            <span class="kanji">霊圧</span>
            <div class="bar"><div id="health_fill"></div></div>
            <span id="health_current">100</span>
        </div>

        <!-- Munitions : bas droite -->
        <div id="weapon_ammo_container">
            <span class="kanji">残弾</span>
            <span id="weapon_ammo_clip">30</span>
            <span id="weapon_ammo_bag">/ 1000</span>
        </div>
    </body>
</html>
